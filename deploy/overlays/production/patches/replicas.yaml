apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-api
spec:
  replicas: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-outbox-worker
spec:
  replicas: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consent-api
spec:
  minAvailable: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consent-outbox-worker
spec:
  minAvailable: 1
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consent-api
spec:
  minReplicas: 3
  maxReplicas: 20
