apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-outbox-worker
  namespace: nvuto-consent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: consent-outbox-worker
  template:
    metadata:
      labels:
        app: consent-outbox-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: consent-outbox-worker
      containers:
        - name: worker
          image: ghcr.io/atlasfsp/nvuto-consent:latest-worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: consent-secrets
                  key: database-url
            - name: NATS_URL
              value: nats://nats.nvuto-messaging.svc.cluster.local:4222
            - name: NATS_STREAM
              value: NVUTO_CONSENT
            - name: NATS_SUBJECT_PREFIX
              value: nvuto.consent
            - name: NATS_REPLICAS
              value: "3"
            - name: NATS_CREDS_FILE
              value: /var/run/secrets/nvuto/nats/consent.creds
          volumeMounts:
            - name: nats-credentials
              mountPath: /var/run/secrets/nvuto/nats
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nats-credentials
          secret:
            secretName: consent-nats-credentials
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: consent-outbox-worker
  namespace: nvuto-consent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: consent-outbox-worker
