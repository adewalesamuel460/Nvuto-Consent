    ErrorResponse:
      type: object
      required:
        - error
        - message
        - correlation_id
      properties:
        error:
          type: string
          description: Stable public machine-readable error code.
          example: invalid_json
        message:
          type: string
          description: Human-readable error description.
          example: the request body must be a single valid JSON object
        field:
          type: string
          description: The field that triggered validation or policy failure, if applicable.
          example: subject_id
        correlation_id:
          type: string
          description: Correlation identifier matching the X-Correlation-ID response header.
          example: 8e9c61e4f4d2243d548325a7a726ea61

  responses:
    400BadRequest:
      description: Malformed syntax, unknown field, invalid types, or missing required parameter
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    401Unauthorized:
      description: Authentication credential missing, malformed, or signature verification failed
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    403Forbidden:
      description: Principal role not authorized for action or subject outside caller scope
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    404NotFound:
      description: Requested resource was not found within caller tenant scope
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    409Conflict:
      description: State conflict, duplicate entity version, or stale challenge generation
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    422UnprocessableEntity:
      description: Syntactically valid request refused by active policy registries
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    500InternalServerError:
      description: Unexpected internal server fault; implementation details safely redacted
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    503ServiceUnavailable:
      description: Transient database outage, statement timeout, or connection contention
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
